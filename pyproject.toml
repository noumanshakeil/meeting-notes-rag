[project]
name = "meeting-notes-rag"
version = "2.0.0"
description = "Searchable meeting-notes RAG with topic filters, attendee tags, and an explorer for old standups and syncs — grounded answers with snippet citations."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
